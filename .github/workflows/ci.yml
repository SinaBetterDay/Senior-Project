name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fair_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # schema.prisma uses both url (pooled) and directUrl (migrations); in CI they
      # point at the same service container.
      DATABASE_URL: postgresql://test:test@localhost:5432/fair_test
      DIRECT_URL: postgresql://test:test@localhost:5432/fair_test
      NODE_ENV: test
      CRON_ENABLED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Run Prisma migrations
        working-directory: server
        run: npx prisma migrate deploy

      - name: Run unit tests
        working-directory: server
        run: npm test

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # From the Railway service URL:
          # /project/<PROJECT>/service/<SERVICE>?environmentId=<ENVIRONMENT>
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_SERVICE_ID:-}" ]; then
            echo "::error::Add repository secret RAILWAY_SERVICE_ID (UUID after /service/ in the Railway URL)."
            exit 1
          fi
          # Project tokens are scoped to one environment — recreate the token for
          # the same environment you pass here if upload returns 404.
          ARGS=(up --detach --ci --verbose --service "$RAILWAY_SERVICE_ID")
          if [ -n "${RAILWAY_PROJECT_ID:-}" ]; then
            ARGS+=(--project "$RAILWAY_PROJECT_ID")
          fi
          if [ -n "${RAILWAY_ENVIRONMENT_ID:-}" ]; then
            ARGS+=(--environment "$RAILWAY_ENVIRONMENT_ID")
          fi
          railway "${ARGS[@]}"
