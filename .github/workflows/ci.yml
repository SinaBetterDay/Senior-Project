name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fair_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d fair_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # schema.prisma uses both url (pooled) and directUrl (migrations); in CI they
      # point at the same service container.
      DATABASE_URL: postgresql://test:test@localhost:5432/fair_test
      DIRECT_URL: postgresql://test:test@localhost:5432/fair_test
      NODE_ENV: test
      CRON_ENABLED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
            apify/package-lock.json

      - name: Install repository dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci --include=dev

      - name: Install Apify Actor dependencies
        working-directory: apify
        run: npm ci

      - name: Validate documentation navigation
        run: npm run docs:check

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Run Prisma migrations
        working-directory: server
        run: npx prisma migrate deploy

      - name: Run all unit tests
        run: npm test

      - name: Type-check and build frontend
        working-directory: client
        run: npm run typecheck && npm run build

      - name: Build Apify Actor
        working-directory: apify
        run: npm run build
