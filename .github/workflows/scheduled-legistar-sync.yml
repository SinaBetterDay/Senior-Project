name: Scheduled Legistar sync

on:
  schedule:
    # 02:00 UTC every day. GitHub scheduled workflows can start late, so the
    # sync itself remains idempotent.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-legistar-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Run Legistar sync
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NODE_ENV: production
      CRON_ENABLED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Run Legistar sync
        working-directory: server
        run: npm run sync:legistar