<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-label="FAIR database ERD">
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #1e3a5f; stroke-width: 2; rx: 6; }
      .title { font: bold 13px system-ui, sans-serif; fill: #0f2744; }
      .field { font: 11px ui-monospace, monospace; fill: #334155; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="920" height="520" fill="#ffffff"/>
  <text x="20" y="28" class="title" font-size="16">FAIR  Core schema (Sprint 2 v1)</text>

  <!-- Jurisdiction -->
  <rect class="box" x="30" y="60" width="160" height="88"/>
  <text x="42" y="82" class="title">Jurisdiction</text>
  <text x="42" y="100" class="field">id, name, type</text>
  <text x="42" y="116" class="field">legistarClientId</text>

  <!-- Politician -->
  <rect class="box" x="250" y="50" width="180" height="108"/>
  <text x="262" y="72" class="title">Politician</text>
  <text x="262" y="90" class="field">id, slug, fullName</text>
  <text x="262" y="106" class="field">officeTitle, party</text>
  <text x="262" y="122" class="field">jurisdictionId (FK)</text>

  <!-- Meeting -->
  <rect class="box" x="30" y="200" width="160" height="96"/>
  <text x="42" y="222" class="title">Meeting</text>
  <text x="42" y="240" class="field">jurisdictionId (FK)</text>
  <text x="42" y="256" class="field">meetingDate, agendaUrl</text>

  <!-- AgendaItem -->
  <rect class="box" x="250" y="200" width="180" height="96"/>
  <text x="262" y="222" class="title">AgendaItem</text>
  <text x="262" y="240" class="field">meetingId (FK)</text>
  <text x="262" y="256" class="field">title, itemNumber</text>

  <!-- VoteRecord -->
  <rect class="box" x="490" y="180" width="170" height="96"/>
  <text x="502" y="202" class="title">VoteRecord</text>
  <text x="502" y="220" class="field">agendaItemId (FK)</text>
  <text x="502" y="236" class="field">politicianId (FK)</text>
  <text x="502" y="252" class="field">vote, voteDate</text>

  <!-- Form700Filing -->
  <rect class="box" x="490" y="50" width="190" height="96"/>
  <text x="502" y="72" class="title">Form700Filing</text>
  <text x="502" y="90" class="field">politicianId (FK)</text>
  <text x="502" y="106" class="field">filingYear, storagePath</text>

  <!-- ConflictFlag -->
  <rect class="box" x="720" y="140" width="170" height="108"/>
  <text x="732" y="162" class="title">ConflictFlag</text>
  <text x="732" y="180" class="field">politicianId (FK)</text>
  <text x="732" y="196" class="field">agendaItemId? (FK)</text>
  <text x="732" y="212" class="field">severity, status</text>

  <!-- relationships -->
  <path class="line" d="M190 95 L250 95"/>
  <path class="line" d="M110 148 L110 200"/>
  <path class="line" d="M190 248 L250 248"/>
  <path class="line" d="M430 248 L490 228"/>
  <path class="line" d="M340 158 L490 98"/>
  <path class="line" d="M430 95 L490 95"/>
  <path class="line" d="M660 95 L720 175"/>
  <path class="line" d="M575 276 L732 220"/>

  <text x="30" y="360" class="field" font-size="12">Source: server/prisma/schema.prisma  PostgreSQL on Supabase</text>
  <text x="30" y="380" class="field" font-size="11" fill="#64748b">Form 700 schedule rows (A, B, C, D, E, A-2) parse into normalized entities before conflict matching.</text>
</svg>
